<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121519" media="(prefers-color-scheme: dark)">
  <title>Gastos</title>
  <style>
    :root{color-scheme:light dark;--bg:#f6f7f9;--surface:#fff;--text:#161c23;--muted:#657180;--line:#e2e6eb;--accent:#215ec6;--soft:#eaf1ff;--danger:#a52e35;--shadow:0 8px 26px rgba(29,43,61,.05)}
    @media(prefers-color-scheme:dark){:root{--bg:#121519;--surface:#1b2026;--text:#f1f3f6;--muted:#a8b2be;--line:#333b44;--accent:#8fb6ff;--soft:#293953;--danger:#ff9ca1;--shadow:none}}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:680px;margin:auto;padding:22px 16px 55px}header{margin:0 0 22px}h1{font-size:26px;letter-spacing:-.7px;margin:0}.heart{font-size:21px;font-weight:400;color:#215ec6;vertical-align:2px;margin-left:4px}h2{font-size:18px;margin:0 0 16px}h3{font-size:15px;margin:0}section,details{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;margin:0 0 16px;box-shadow:var(--shadow)}.balance{text-align:center;padding:27px 18px}.balance-label{color:var(--muted);margin:0}.balance-value{font-size:clamp(33px,8vw,44px);font-weight:750;letter-spacing:-1.5px;margin:3px 0 16px;font-variant-numeric:tabular-nums}.balance-value:last-child{margin-bottom:0}.field{margin-bottom:16px}label,.field-title{display:block;font-size:14px;font-weight:650;margin-bottom:7px}input{width:100%;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--text);min-height:47px;padding:10px 13px;font:inherit;outline:none}input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}button{font:inherit;cursor:pointer;border-radius:11px;border:1px solid var(--line);padding:10px 14px;min-height:44px;background:var(--surface);color:var(--text)}button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;width:100%}@media(prefers-color-scheme:dark){.primary{color:#111820}}.secondary{background:var(--soft);border-color:transparent;color:var(--accent);font-weight:650}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choices button{min-width:0;font-size:14px;line-height:1.3}.choices button[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);color:var(--accent);font-weight:700}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 16px}.tabs button{font-weight:650}.tabs button[aria-selected="true"]{background:var(--soft);color:var(--accent);border-color:var(--accent)}.month{margin:0 0 22px}.month-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:9px;margin-bottom:2px}.month-head span{font-weight:700;font-variant-numeric:tabular-nums}.expense{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.expense:last-child{border-bottom:0}.expense-main{min-width:0;flex:1}.expense-name{font-weight:660;overflow-wrap:anywhere}.expense-meta{font-size:13px;color:var(--muted);margin-top:2px}.expense-end{text-align:right;flex-shrink:0}.expense-amount{font-weight:750;font-variant-numeric:tabular-nums}.delete{color:var(--danger);border:0;padding:4px 0;min-height:30px;font-size:13px;background:transparent}.delete.confirm{font-weight:750;text-decoration:underline}.summary-row{padding:14px 0;border-bottom:1px solid var(--line)}.summary-row:last-child{border:0}.summary-stats{font-size:14px;color:var(--muted);margin-top:5px}.empty{color:var(--muted);text-align:center;padding:24px 3px}details summary{font-weight:700;cursor:pointer}details .settings{padding-top:18px}details .field:last-child{margin-bottom:0}.error{color:var(--danger);font-size:13px;min-height:20px;margin-top:5px}.connection{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);margin:0 0 14px}.connection strong{font-weight:650}.setup{margin-bottom:16px}.setup p{margin:0 0 12px;color:var(--muted);font-size:14px}.setup .secondary{width:100%;margin-top:8px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1;min-width:145px}.backup{margin:8px 0 18px}.backup button{width:100%}.footnote{color:var(--muted);font-size:12px;text-align:center;margin:6px 8px}[hidden]{display:none!important}button:disabled{opacity:.5;cursor:not-allowed}@media(max-width:390px){section,details{padding:17px}.expense{gap:8px}.expense-meta{font-size:12px}}
    @media(prefers-color-scheme:dark){.heart{color:#fff}}
  </style>
</head>
<body>
<main>
  <header><h1>Gastos <span class="heart" aria-hidden="true">♡</span></h1></header>
  <div class="connection" role="status" aria-live="polite"><span id="connection">Sin configurar</span></div>
  <section class="setup" id="setup" hidden><h2>Empezar</h2><p id="setupInfo">Crea vuestro espacio o abre el enlace de invitación.</p><button type="button" class="primary" id="createRoom">Crear espacio compartido</button></section>
  <section class="balance" aria-live="polite">
    <p class="balance-label" id="balanceLabel" hidden></p>
    <div class="balance-value" id="balanceValue">0,00 €</div>
    <button class="secondary" id="settleButton" type="button" hidden>Saldar cuentas</button>
  </section>
  <section aria-labelledby="addTitle">
    <h2 id="addTitle">Añadir gasto</h2>
    <form id="expenseForm" novalidate>
      <div class="field"><label for="amount">Importe (€)</label><input id="amount" type="text" inputmode="decimal" autocomplete="off" required><div class="error" id="amountError" role="alert"></div></div>
      <div class="field"><label for="concept">Concepto</label><input id="concept" type="text" autocomplete="off" maxlength="300"></div>
      <div class="field"><div class="field-title" id="payerTitle">¿Quién ha pagado?</div><div class="choices" role="group" aria-labelledby="payerTitle"><button type="button" class="payer" data-payer="0" aria-pressed="true">JC</button><button type="button" class="payer" data-payer="1" aria-pressed="false">ALI</button></div></div>
      <button type="submit" class="primary">Añadir gasto</button>
    </form>
  </section>
  <div class="tabs" role="tablist" aria-label="Vistas"><button id="tabExpenses" type="button" role="tab" aria-controls="panelExpenses" aria-selected="true">Gastos</button><button id="tabSummary" type="button" role="tab" aria-controls="panelSummary" aria-selected="false">Resumen por mes</button></div>
  <section id="panelExpenses" role="tabpanel" aria-labelledby="tabExpenses"></section>
  <section id="panelSummary" role="tabpanel" aria-labelledby="tabSummary" hidden></section>
  <div class="backup"><button type="button" class="secondary" id="exportButton" disabled>Exportar copia de seguridad (CSV)</button></div>
  <p class="footnote">Gastos compartidos mediante Firebase. No compartas el enlace con otras personas: funciona como llave de acceso.</p>
</main>
<script>
(()=>{'use strict';
// Rellena estos datos públicos de Firebase antes de publicar.
const FIREBASE_API_KEY="AIzaSyAKbrKQ0L6gYTkw4oSBNf8o4dOTqD8btyk";
const FIREBASE_PROJECT_ID="gastos-jc-ali";
const PAYER_KEY='gastos_ultimo_pagador_v1', AUTH_KEY='gastos_auth_v2', ROOM_KEY='gastos_room_v2';
const NAMES=['JC','ALI'];
const $=id=>document.getElementById(id);
const money=v=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(v/100);
const el=(tag,cls,txt)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=String(txt);return n};
let entries=[], payer=localStorage.getItem(PAYER_KEY)==='1'?1:0, room=null, auth=null, pendingDelete=null,deleteTimer=null,busy=false,refreshTimer=null,hasLoaded=false;
const configured=()=>FIREBASE_API_KEY!=='PEGA_AQUI_LA_API_KEY'&&FIREBASE_PROJECT_ID!=='PEGA_AQUI_EL_PROJECT_ID';
const roomValid=x=>typeof x==='string'&&/^[a-f0-9]{64}$/.test(x);
function roomFromLink(){const m=location.hash.match(/^#s=([a-f0-9]{64})$/);return m?m[1]:null}
const status=t=>$('connection').textContent=t;
function resetDelete(){pendingDelete=null;if(deleteTimer)clearTimeout(deleteTimer);deleteTimer=null}
function setBusy(on){busy=on;$('expenseForm').querySelector('button[type=submit]').disabled=on;$('settleButton').disabled=on;$('createRoom').disabled=on;$('exportButton').disabled=on||!room||!hasLoaded}
function showSetup(msg){$('setup').hidden=false;$('setupInfo').textContent=msg;$('createRoom').hidden=!configured();setBusy(true)}
function monthKey(ts){const d=new Date(ts);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function monthName(k){const [y,m]=k.split('-').map(Number);const x=new Intl.DateTimeFormat('es-ES',{month:'long',year:'numeric'}).format(new Date(y,m-1));return x[0].toUpperCase()+x.slice(1)}
function shortDate(ts){return new Intl.DateTimeFormat('es-ES',{day:'2-digit',month:'2-digit',year:'2-digit'}).format(new Date(ts))}
function part(e){return e.split==='other'?e.amount:Math.round(e.amount/2)}
function balance(){return entries.reduce((v,e)=>v+(e.payer===0?part(e):-part(e)),0)}
function grouped(){const g=new Map();for(const e of [...entries].sort((a,b)=>b.date-a.date||b.id.localeCompare(a.id))){const key=monthKey(e.date);if(!g.has(key))g.set(key,[]);g.get(key).push(e)}return g}
function render(){document.querySelectorAll('.payer').forEach(b=>{b.textContent=NAMES[+b.dataset.payer];b.setAttribute('aria-pressed',String(+b.dataset.payer===payer))});const n=balance();$('balanceLabel').hidden=n===0;$('balanceLabel').textContent=n===0?'':`${NAMES[n>0?1:0]} debe a ${NAMES[n>0?0:1]}`;$('balanceValue').textContent=money(Math.abs(n));$('settleButton').hidden=n===0;
 const panel=$('panelExpenses');panel.replaceChildren();const groups=grouped();if(!groups.size)panel.append(el('p','empty','Todavía no hay gastos.'));for(const [key,items] of groups){const wrap=el('div','month'),head=el('div','month-head');head.append(el('h3','',monthName(key)),el('span','',money(items.filter(e=>!e.settlement).reduce((v,e)=>v+e.amount,0))));wrap.append(head);for(const e of items){const row=el('div','expense'),left=el('div','expense-main'),right=el('div','expense-end');left.append(el('div','expense-name',e.concept.trim()||'Sin concepto'),el('div','expense-meta',`${shortDate(e.date)} · pagó ${NAMES[e.payer]}${e.settlement?' · liquidación':''}`));right.append(el('div','expense-amount',money(e.amount)));const del=el('button',`delete${pendingDelete===e.id?' confirm':''}`,pendingDelete===e.id?'¿Seguro?':'Borrar');del.type='button';del.disabled=busy;del.addEventListener('click',()=>deleteEntry(e.id));right.append(del);row.append(left,right);wrap.append(row)}panel.append(wrap)}
 const summary=$('panelSummary');summary.replaceChildren();let any=false;for(const [key,items] of groups){const xs=items.filter(e=>!e.settlement);if(!xs.length)continue;any=true;const row=el('div','summary-row'),head=el('div','month-head');head.append(el('h3','',monthName(key)),el('span','',money(xs.reduce((v,e)=>v+e.amount,0))));row.append(head,el('div','summary-stats',`${xs.length} ${xs.length===1?'gasto':'gastos'}`));for(let i=0;i<2;i++)row.append(el('div','summary-stats',`${NAMES[i]} pagó ${money(xs.filter(e=>e.payer===i).reduce((v,e)=>v+e.amount,0))}`));summary.append(row)}if(!any)summary.append(el('p','empty','Todavía no hay gastos que resumir.'))}
function parseAmount(input){const raw=input.trim().replace(/\s/g,'');if(!/^\d+(?:[.,]\d{1,2})?$/.test(raw))return null;const [a,b='']=raw.replace(',','.').split('.');const v=Number(a)*100+Number(b.padEnd(2,'0'));return Number.isSafeInteger(v)&&v>0&&v<=100000000? v:null}
async function jsonFetch(url,opts={}){let r;try{r=await fetch(url,opts)}catch(e){throw Error('No hay conexión. Comprueba Internet y vuelve a intentarlo.')}const body=await r.json().catch(()=>({}));if(!r.ok)throw Error(body.error?.message||`Error del servicio (${r.status})`);return body}
async function token(){if(auth&&auth.idToken&&Date.now()<auth.until-60000)return auth.idToken;if(auth?.refreshToken){const r=await jsonFetch(`https://securetoken.googleapis.com/v1/token?key=${encodeURIComponent(FIREBASE_API_KEY)}`,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'refresh_token',refresh_token:auth.refreshToken})});auth={idToken:r.id_token,refreshToken:r.refresh_token,until:Date.now()+Number(r.expires_in)*1000};localStorage.setItem(AUTH_KEY,JSON.stringify(auth));return auth.idToken}const r=await jsonFetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${encodeURIComponent(FIREBASE_API_KEY)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({returnSecureToken:true})});auth={idToken:r.idToken,refreshToken:r.refreshToken,until:Date.now()+Number(r.expiresIn)*1000};localStorage.setItem(AUTH_KEY,JSON.stringify(auth));return auth.idToken}
const base=()=>`https://firestore.googleapis.com/v1/projects/${encodeURIComponent(FIREBASE_PROJECT_ID)}/databases/(default)/documents/rooms/${room}/expenses`;
async function call(path,opts={}){const id=await token();return jsonFetch(base()+path,{...opts,headers:{'Authorization':`Bearer ${id}`,...opts.headers}})}
function encodeEntry(e){return {fields:{amount:{integerValue:String(e.amount)},concept:{stringValue:e.concept},payer:{integerValue:String(e.payer)},split:{stringValue:e.split},date:{integerValue:String(e.date)},settlement:{booleanValue:e.settlement}}}}
function decodeEntry(doc){const f=doc.fields||{};const e={id:doc.name.split('/').pop(),amount:Number(f.amount?.integerValue),concept:f.concept?.stringValue,payer:Number(f.payer?.integerValue),split:f.split?.stringValue,date:Number(f.date?.integerValue),settlement:f.settlement?.booleanValue===true};return Number.isSafeInteger(e.amount)&&e.amount>0&&typeof e.concept==='string'&&(e.payer===0||e.payer===1)&&['half','other'].includes(e.split)&&Number.isSafeInteger(e.date)?e:null}
async function load(){if(!room||busy)return;try{let result=[],page='';do{const q=new URLSearchParams({pageSize:'1000'});if(page)q.set('pageToken',page);const response=await call('?'+q);result.push(...(response.documents||[]).map(decodeEntry).filter(Boolean));page=response.nextPageToken||''}while(page);entries=result;hasLoaded=true;$('exportButton').disabled=busy;render();status('Sincronizado · JC y ALI')}catch(e){status('Sin conexión · vuelve a intentarlo');console.warn(e.message)}}
async function addEntry(e){if(busy||!room)return false;setBusy(true);try{await call('?documentId='+encodeURIComponent(e.id),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(encodeEntry(e))});entries.push(e);render();status('Guardado');return true}catch(err){alert('No se ha guardado: '+err.message);return false}finally{setBusy(false);render();load()}}
async function deleteEntry(id){if(pendingDelete!==id){resetDelete();pendingDelete=id;render();deleteTimer=setTimeout(()=>{pendingDelete=null;deleteTimer=null;render()},3000);return}resetDelete();if(busy)return;setBusy(true);try{await call('/'+encodeURIComponent(id),{method:'DELETE'});entries=entries.filter(e=>e.id!==id);status('Gasto borrado')}catch(err){alert('No se ha podido borrar: '+err.message)}finally{setBusy(false);render();load()}}
function newId(){return crypto.randomUUID().replaceAll('-','')}
async function start(){if(!configured()){status('Configuración pendiente');showSetup('Falta añadir la clave pública y el identificador del proyecto Firebase en el HTML. Consulta la guía adjunta.');return}const link=roomFromLink(),saved=localStorage.getItem(ROOM_KEY);room=link||(roomValid(saved)?saved:null);if(!room){status('Espacio sin crear');showSetup('Crea un espacio compartido y envía el enlace de invitación a la otra persona.');setBusy(false);return}if(link)localStorage.setItem(ROOM_KEY,link);location.hash='s='+room;$('setup').hidden=true;status('Conectando…');setBusy(false);try{try{auth=JSON.parse(localStorage.getItem(AUTH_KEY)||'null')}catch(e){auth=null}await token();await load();refreshTimer=setInterval(()=>{if(!document.hidden)load()},10000)}catch(e){status('Error de conexión');alert('No se ha podido conectar: '+e.message)}}
$('createRoom').addEventListener('click',()=>{const bytes=new Uint8Array(32);crypto.getRandomValues(bytes);room=Array.from(bytes,x=>x.toString(16).padStart(2,'0')).join('');localStorage.setItem(ROOM_KEY,room);location.hash='s='+room;$('setup').hidden=true;start()});
document.querySelectorAll('.payer').forEach(b=>b.addEventListener('click',()=>{payer=+b.dataset.payer;localStorage.setItem(PAYER_KEY,String(payer));render()}));
$('expenseForm').addEventListener('submit',async ev=>{ev.preventDefault();const amount=parseAmount($('amount').value);if(amount===null){$('amountError').textContent='Introduce un importe válido, mayor que cero y con hasta dos decimales.';$('amount').focus();return}$('amountError').textContent='';const ok=await addEntry({id:newId(),amount,concept:$('concept').value.trim(),payer,split:'half',date:Date.now(),settlement:false});if(ok){$('amount').value='';$('concept').value='';$('amount').focus()}});
$('amount').addEventListener('input',()=>$('amountError').textContent='');
$('settleButton').addEventListener('click',async()=>{if(busy)return;await load();if(!hasLoaded)return;const b=balance();if(!b)return;const debtor=NAMES[b>0?1:0],creditor=NAMES[b>0?0:1];if(!confirm(`¿Confirmas que ${debtor} ha pagado ${money(Math.abs(b))} a ${creditor}?\n\nSe registrará una liquidación y el saldo quedará a cero. Si todavía no se ha realizado el pago, pulsa Cancelar.`))return;await addEntry({id:newId(),amount:Math.abs(b),concept:'Liquidación',payer:b>0?1:0,split:'other',date:Date.now(),settlement:true})});
function csvValue(v){let t=String(v??'');if(/^[\s\u0000-\u001f]*[=+@\-]/.test(t))t="'"+t;return '"'+t.replaceAll('"','""')+'"'}
function exportCsv(){if(!hasLoaded){alert('Espera a que los datos terminen de sincronizarse.');return}const header=['Fecha y hora','Concepto','Pagó','Importe (€)','Importe (céntimos)','Tipo','Reparto'];const records=[header,...[...entries].sort((a,b)=>b.date-a.date).map(e=>[new Date(e.date).toLocaleString('es-ES'),e.concept||'Sin concepto',NAMES[e.payer],(e.amount/100).toFixed(2).replace('.',','),e.amount,e.settlement?'Liquidación':'Gasto',e.split==='other'?'Lo debe todo el otro':'A medias'])];const csv='\uFEFF'+records.map(line=>line.map(csvValue).join(';')).join('\r\n');const file=new Blob([csv],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(file);const a=document.createElement('a');a.href=url;a.download='gastos-jc-ali-'+new Date().toISOString().slice(0,10)+'.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
$('exportButton').addEventListener('click',exportCsv);
function tab(summary){$('tabExpenses').setAttribute('aria-selected',String(!summary));$('tabSummary').setAttribute('aria-selected',String(summary));$('panelExpenses').hidden=summary;$('panelSummary').hidden=!summary}
$('tabExpenses').addEventListener('click',()=>tab(false));$('tabSummary').addEventListener('click',()=>tab(true));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});render();start();
})();
</script>
</body>
</html>
